name: Pipeline v1 E2E

on:
  workflow_dispatch:

jobs:
  real-video-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Require Anthropic key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY secret is missing"
            exit 1
          fi

      - name: Write .env
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cp .env.example .env
          python3 - <<'PY'
          import os, pathlib
          p = pathlib.Path(".env")
          text = p.read_text()
          text = text.replace("ANTHROPIC_API_KEY=", "ANTHROPIC_API_KEY=" + os.environ["ANTHROPIC_API_KEY"])
          p.write_text(text)
          PY

      - name: Start full stack
        run: docker compose up -d --build

      - name: Wait for web
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000 >/dev/null; then exit 0; fi
            sleep 5
          done
          docker compose logs
          exit 1

      - name: Generate real MP4 fixture and run full pipeline
        run: |
          docker compose exec -T worker bash -lc 'bash scripts/generate_fixture.sh && BASE_URL=http://web:3000 bash scripts/e2e.sh'

      - name: Copy generated MP4
        run: docker compose cp worker:/app/tests/fixtures/generated-clip.mp4 ./generated-clip.mp4

      - name: Capture logs
        if: always()
        run: |
          docker compose logs --no-color > docker-compose.log
          docker compose logs --no-color worker > worker.log

      - name: Upload proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-v1-proof
          path: |
            generated-clip.mp4
            worker.log
            docker-compose.log
          if-no-files-found: warn

      - name: Stop stack
        if: always()
        run: docker compose down -v
