name: Pipeline v1 real local E2E

on:
  push:
    branches: ["pipeline-v1"]
  workflow_dispatch:

jobs:
  three-video-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configure local provider
        run: |
          cp .env.example .env
          sed -i 's/LLM_PROVIDER=.*/LLM_PROVIDER=local/' .env
          sed -i 's/WHISPER_MODEL=.*/WHISPER_MODEL=tiny/' .env

      - name: Start full stack
        run: docker compose up -d --build

      - name: Wait for web
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:3000 >/dev/null; then exit 0; fi
            sleep 3
          done
          docker compose logs
          exit 1

      - name: Generate three MP4 fixtures
        run: docker compose exec -T worker bash -lc 'bash scripts/generate_fixtures.sh'

      - name: Run three end-to-end projects
        run: docker compose exec -T worker bash -lc 'BASE_URL=http://web:3000 bash scripts/e2e-three.sh'

      - name: Copy proof files
        if: always()
        run: |
          mkdir -p proof
          docker compose cp worker:/app/tests/proof/. ./proof/ || true
          docker compose logs --no-color worker > proof/worker.log || true
          docker compose logs --no-color web > proof/web.log || true

      - name: Upload proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-v1-three-video-proof
          path: proof/
          if-no-files-found: warn

      - name: Stop stack
        if: always()
        run: docker compose down -v
